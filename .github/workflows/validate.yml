name: Validate manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: apps/
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              indentation: disable
              new-line-at-end-of-file: disable

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/yannh/kubeconform:v0.6.7 \
            -summary -ignore-missing-schemas -kubernetes-version 1.31.0 \
            $(find apps -name "*.yaml")

  kube-linter:
    # Advisory for now: existing manifests still lack resources, probes and
    # securityContexts. Remove continue-on-error on the lint step once fixed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kube-linter
        run: |
          curl -sSL -o kube-linter.tar.gz \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.2/kube-linter-linux.tar.gz
          tar -xzf kube-linter.tar.gz
          sudo mv kube-linter /usr/local/bin/

      - name: Lint Kubernetes manifests
        continue-on-error: true
        run: kube-linter lint apps/

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Ansible
        continue-on-error: true
        run: |
          pip install ansible-lint
          cd ansible
          ansible-lint .

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}