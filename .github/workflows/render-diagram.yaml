name: Render Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/*.d2'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Render diagrams to SVG and PNG
        run: |
          for file in docs/diagrams/*.d2; do
            name=$(basename "$file" .d2)
            d2 "$file" "docs/diagrams/${name}.svg"
            d2 "$file" "docs/diagrams/${name}.png"
          done

      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*.svg docs/diagrams/*.png
          git diff --staged --quiet || git commit -m "Auto-render diagrams [skip ci]"
          git push