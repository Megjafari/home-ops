- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false
  tags: [k8s, swap]

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true
    mode: '0644'
  tags: [k8s, swap]

- name: Ensure /usr/lib/cni exists
  ansible.builtin.file:
    path: /usr/lib/cni
    state: directory
    mode: '0755'
  tags: [k8s, cni]

- name: Copy CNI binaries to /usr/lib/cni
  ansible.builtin.copy:
    src: /opt/cni/bin/
    dest: /usr/lib/cni/
    remote_src: true
    mode: preserve
  failed_when: false
  notify: Restart containerd
  tags: [k8s, cni]
