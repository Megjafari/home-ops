- name: Disable swap immediately
  command: swapoff -a
  changed_when: false
  tags: [k8s, swap]

- name: Remove swap entries from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true
  tags: [k8s, swap]

- name: Ensure /usr/lib/cni exists
  file:
    path: /usr/lib/cni
    state: directory
    mode: '0755'
  tags: [k8s, cni]

- name: Copy CNI binaries to /usr/lib/cni
  copy:
    src: /opt/cni/bin/
    dest: /usr/lib/cni/
    remote_src: true
    mode: preserve
  register: cni_copy
  ignore_errors: true
  tags: [k8s, cni]

- name: Restart containerd if CNI binaries were copied
  systemd:
    name: containerd
    state: restarted
  when: cni_copy is changed
  tags: [k8s, cni]