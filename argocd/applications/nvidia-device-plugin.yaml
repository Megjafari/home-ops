apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NVIDIA/k8s-device-plugin.git
    targetRevision: v0.20.0
    path: deployments/static
    directory:
      include: nvidia-device-plugin.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # No automated sync: this adopts an existing install. Review the diff in
  # ArgoCD before syncing.
