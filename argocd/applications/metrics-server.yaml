apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/metrics-server.git
    targetRevision: v0.9.0
    path: manifests/base
    kustomize:
      patches:
        # The kubelets use self-signed certificates on this cluster.
        - target:
            kind: Deployment
            name: metrics-server
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # No automated sync: this adopts an existing install. Review the diff in
  # ArgoCD before syncing.
