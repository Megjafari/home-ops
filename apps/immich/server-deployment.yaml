apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:release@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
        startupProbe:
          tcpSocket:
            port: 2283
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 2283
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 2283
          periodSeconds: 20
          failureThreshold: 6
        ports:
        - containerPort: 2283
        env:
        - name: DB_HOSTNAME
          value: postgres.postgres.svc.cluster.local
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: DB_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
        - name: REDIS_HOSTNAME
          value: redis.immich.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        volumeMounts:
        - name: upload
          mountPath: /usr/src/app/upload
      volumes:
      - name: upload
        persistentVolumeClaim:
          claimName: immich-upload-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  type: NodePort
  selector:
    app: immich-server
  ports:
  - port: 2283
    targetPort: 2283