apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: default
data:
  services.yaml: |
    - Infrastructure:
        - ArgoCD:
            href: https://192.168.1.8:31471
            description: GitOps
            icon: argo-cd.png
        - Proxmox PVE:
            href: https://192.168.1.50:8006
            description: Virtualization
            icon: proxmox.png
    - Network:
        - OPNsense:
            href: https://192.168.1.1
            description: Router / Firewall
            icon: opnsense.png
        - Zyxel Switch:
            href: https://192.168.1.118
            description: Managed switch
            icon: zyxel.png
        - UniFi:
            href: https://192.168.1.9:8443
            description: Network controller
            icon: unifi-network.png
    - Media:
        - Immich:
            href: http://192.168.1.8:31364
            description: Photo backup
            icon: immich.png
        - Jellyfin:
            href: http://192.168.1.8:31225
            description: Media server
            icon: jellyfin.png
        - Jellyseerr:
            href: http://192.168.1.8:31161
            description: Media requests
            icon: jellyseerr.png
        - Navidrome:
            href: http://192.168.1.8:32615
            description: Music streaming
            icon: navidrome.png
        - qBittorrent:
            href: http://192.168.1.8:30876
            description: Torrent client
            icon: qbittorrent.png
        - Sonarr:
            href: http://192.168.1.8:32491
            description: TV shows
            icon: sonarr.png
        - Radarr:
            href: http://192.168.1.8:32644
            description: Movies
            icon: radarr.png
        - Prowlarr:
            href: http://192.168.1.8:31144
            description: Indexer manager
            icon: prowlarr.png
    - Productivity:
        - Vaultwarden:
            href: http://192.168.1.8:31919
            description: Password manager
            icon: vaultwarden.png
        - Nextcloud:
            href: http://192.168.1.8:31222
            description: File sync
            icon: nextcloud.png
        - Home Assistant:
            href: http://192.168.1.9:8123
            description: Home automation
            icon: home-assistant.png
        - Homelable:
            href: http://192.168.1.8:30474
            description: Network topology
            icon: homelab.png
    - Monitoring:
        - Grafana:
            href: http://192.168.1.8:31396
            description: Dashboards
            icon: grafana.png
        - Prometheus:
            href: http://192.168.1.8:32578
            description: Metrics database
            icon: prometheus.png
        - Uptime Kuma:
            href: http://192.168.1.8:32422
            description: Status monitoring
            icon: uptime-kuma.png
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Göteborg
        latitude: 57.7089
        longitude: 11.9746
        timezone: Europe/Stockholm
        units: metric
        cache: 5
  settings.yaml: |
    title: HomeOps
    theme: dark
    color: slate
    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80
      blur: md
      saturate: 75
      brightness: 55
      opacity: 60
    cardBlur: md
    layout:
      Infrastructure:
        style: row
        columns: 2
      Network:
        style: row
        columns: 3
      Media:
        style: row
        columns: 4
      Productivity:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 3
  bookmarks.yaml: ""