apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:latest@sha256:4af0c804003481e100180e1f8d4d5e9c48163fedc0f88d061881b615aef9d183
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "mullvad"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: mullvad-credentials
              key: WIREGUARD_PRIVATE_KEY
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              name: mullvad-credentials
              key: WIREGUARD_ADDRESSES
        - name: DOT
          value: "off"
        - name: DNS_ADDRESS
          value: "8.8.8.8"
        - name: BLOCK_MALICIOUS
          value: "off"
        - name: BLOCK_ADS
          value: "off"
        - name: BLOCK_SURVEILLANCE
          value: "off"
        - name: VPN_MTU
          value: "1280"
        ports:
        - containerPort: 8080
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Stockholm"
        - name: WEBUI_PORT
          value: "8080"
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - -c
              - |
                sleep 5
                grep -q "HostHeaderValidation" /config/qBittorrent/qBittorrent.conf || echo 'WebUI\HostHeaderValidation=false' >> /config/qBittorrent/qBittorrent.conf
                grep -q "AuthSubnetWhitelistEnabled" /config/qBittorrent/qBittorrent.conf || echo 'WebUI\AuthSubnetWhitelistEnabled=true' >> /config/qBittorrent/qBittorrent.conf
                grep -q "AuthSubnetWhitelist=" /config/qBittorrent/qBittorrent.conf || echo 'WebUI\AuthSubnetWhitelist=192.168.1.0/24, 10.244.0.0/16' >> /config/qBittorrent/qBittorrent.conf
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: media-library-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  type: NodePort
  selector:
    app: qbittorrent
  ports:
  - port: 8080
    targetPort: 8080