apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-backend
  namespace: homelable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelable-backend
  template:
    metadata:
      labels:
        app: homelable-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/pouzor/homelable-backend:latest
          env:
            - name: SQLITE_PATH
              value: /app/data/homelab.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            capabilities:
              add: ["NET_RAW"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelable-data