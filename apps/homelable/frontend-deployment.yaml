apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-frontend
  namespace: homelable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelable-frontend
  template:
    metadata:
      labels:
        app: homelable-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/pouzor/homelable-frontend:latest
        env:
        - name: BACKEND_URL
          value: "http://homelable-backend.homelable.svc.cluster.local:8000"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-frontend
  namespace: homelable
spec:
  type: NodePort
  selector:
    app: homelable-frontend
  ports:
  - port: 80
    targetPort: 80