apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable-frontend
  namespace: homelable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelable-frontend
  template:
    metadata:
      labels:
        app: homelable-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/pouzor/homelable-frontend:latest@sha256:e6748fe73ce62d045af7332d16a888b8b9eafac1768d96b8a57e6a1bad878eb6
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        startupProbe:
          tcpSocket:
            port: 80
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 20
          failureThreshold: 6
        env:
        - name: BACKEND_URL
          value: "http://homelable-backend.homelable.svc.cluster.local:8000"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: homelable-frontend
  namespace: homelable
spec:
  type: NodePort
  selector:
    app: homelable-frontend
  ports:
  - port: 80
    targetPort: 80