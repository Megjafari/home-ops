apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      containers:
      - name: unifi
        image: lscr.io/linuxserver/unifi-network-application:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Stockholm"
        - name: MONGO_USER
          value: "unifi"
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: mongo-credentials
              key: MONGO_PASSWORD
        - name: MONGO_HOST
          value: "mongo.network.svc.cluster.local"
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DBNAME
          value: "unifi"
        - name: MONGO_AUTHSOURCE
          value: "admin"
        ports:
        - containerPort: 8443
          name: https-ui
        - containerPort: 8080
          name: device-comm
        - containerPort: 3478
          protocol: UDP
          name: stun
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: unifi-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: network
spec:
  type: NodePort
  selector:
    app: unifi
  ports:
  - name: https-ui
    port: 8443
    targetPort: 8443
  - name: device-comm
    port: 8080
    targetPort: 8080
  - name: stun
    port: 3478
    targetPort: 3478
    protocol: UDP