<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8e8e98"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c5c66"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#09090b"/>
  <text x="60" y="78" fill="#ededef" font-size="26" font-weight="700">How blog.meghdadjafari.dev is served</text>

  <!-- Home network -->
  <rect x="700" y="110" width="880" height="740" rx="18" fill="#0c0c0f" stroke="#26262c" stroke-width="2"/>
  <text x="726" y="146" fill="#8e8e98" font-size="15" letter-spacing="1.5">HOME NETWORK  /  PROXMOX HOST</text>

  <!-- Coolify VM -->
  <rect x="740" y="170" width="520" height="640" rx="14" fill="#101014" stroke="#2b2b33" stroke-width="2"/>
  <text x="766" y="204" fill="#ededef" font-size="18" font-weight="600">Coolify VM</text>

  <!-- Postgres LXC -->
  <rect x="1340" y="410" width="210" height="240" rx="14" fill="#101014" stroke="#2b2b33" stroke-width="2"/>
  <text x="1366" y="444" fill="#ededef" font-size="18" font-weight="600">Postgres LXC</text>

  <!-- Outside boxes -->
  <g fill="#18181d" stroke="#34343c" stroke-width="2">
    <rect x="60" y="200" width="200" height="72" rx="10"/>
    <rect x="340" y="200" width="200" height="72" rx="10"/>
    <rect x="340" y="480" width="200" height="72" rx="10"/>
    <rect x="60" y="700" width="200" height="72" rx="10"/>
  </g>
  <g fill="#ededef" font-size="18" font-weight="600" text-anchor="middle">
    <text x="160" y="234">Visitor</text>
    <text x="440" y="234">Cloudflare</text>
    <text x="440" y="514">GitHub</text>
    <text x="160" y="734">Me</text>
  </g>
  <g fill="#8e8e98" font-size="14" text-anchor="middle">
    <text x="160" y="256">browser</text>
    <text x="440" y="256">DNS, TLS, tunnel</text>
    <text x="440" y="536">source code</text>
    <text x="160" y="756">laptop and phone</text>
  </g>

  <!-- Inside boxes -->
  <g fill="#18181d" stroke="#34343c" stroke-width="2">
    <rect x="900" y="230" width="200" height="72" rx="10"/>
    <rect x="900" y="360" width="200" height="72" rx="10"/>
    <rect x="780" y="520" width="200" height="92" rx="10"/>
    <rect x="1020" y="520" width="200" height="92" rx="10"/>
    <rect x="1020" y="700" width="200" height="72" rx="10"/>
    <rect x="1366" y="500" width="160" height="72" rx="10"/>
  </g>
  <g fill="#ededef" font-size="18" font-weight="600" text-anchor="middle">
    <text x="1000" y="264">cloudflared</text>
    <text x="1000" y="394">Traefik</text>
    <text x="880" y="552">Frontend</text>
    <text x="1120" y="552">API</text>
    <text x="1120" y="734">Volume</text>
    <text x="1446" y="534">PostgreSQL</text>
  </g>
  <g fill="#8e8e98" font-size="14" text-anchor="middle">
    <text x="1000" y="286">container, host network</text>
    <text x="1000" y="416">Coolify proxy, port 80</text>
    <text x="880" y="574">nginx, port 80</text>
    <text x="1120" y="574">ASP.NET Core, port 8080</text>
    <text x="1120" y="756">/data/uploads</text>
    <text x="1446" y="556">port 5432</text>
  </g>
  <g fill="#8aa4ff" font-size="13" text-anchor="middle">
    <text x="880" y="596">blog.meghdadjafari.dev</text>
    <text x="1120" y="596">blog-api.meghdadjafari.dev</text>
  </g>

  <!-- Request path arrows -->
  <g stroke="#8e8e98" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M260 236 H336"/>
    <path d="M540 236 H896"/>
    <path d="M1000 302 V356"/>
    <path d="M1000 432 V470 H880 V516"/>
    <path d="M1000 432 V470 H1120 V516"/>
    <path d="M1120 612 V696"/>
    <path d="M1220 556 H1362"/>
  </g>

  <!-- Admin / deploy arrows (dashed) -->
  <g stroke="#5c5c66" stroke-width="2.5" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow-dim)">
    <path d="M540 516 H736"/>
    <path d="M260 736 H736"/>
  </g>

  <!-- Arrow labels -->
  <g fill="#8e8e98" font-size="14" text-anchor="middle">
    <text x="298" y="224">HTTPS</text>
    <text x="620" y="224">tunnel</text>
    <text x="1062" y="338" text-anchor="start">http://localhost:80</text>
    <text x="1136" y="660" text-anchor="start">images</text>
    <text x="1291" y="540">SQL</text>
    <text x="1291" y="584">only from</text>
    <text x="1291" y="602">Coolify VM</text>
  </g>
  <g fill="#6f6f79" font-size="14" text-anchor="middle">
    <text x="640" y="504">deploy key</text>
    <text x="500" y="724">Tailscale (private access)</text>
  </g>

  <!-- Footnote -->
  <text x="60" y="842" fill="#8e8e98" font-size="15">Solid: request path. Dashed: deploys and admin access.</text>
  <text x="60" y="866" fill="#8e8e98" font-size="15">No ports are forwarded on the router. The tunnel is opened from the Coolify VM out to Cloudflare.</text>
</svg>
